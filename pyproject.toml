[project]
name = "freelance-proposal-copilot"
version = "1.0.0"
description = "Human-in-the-loop freelance job discovery, proposal drafting, review, tracking, and reply alerts"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.3",
  "uvicorn[standard]==0.35.0",
  "PyYAML==6.0.3",
  "requests==2.33.1",
  "openpyxl==3.1.5",
  "Jinja2==3.1.6",
  "python-multipart==0.0.20",
  "msal==1.34.0",
  "playwright==1.55.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
